const KEY='hsk1_master_v2';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{done:[],vocab:{},scores:{},practiceBest:0,mockBest:0};
let practiceSet=[],practiceAnswers={}; let mockPos=0,mockAnswers={};
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderChrome()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));document.getElementById('sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});if(id==='home')renderHome();if(id==='learn')renderLearn();if(id==='vocabulary')renderVocab();if(id==='grammar')renderGrammar();if(id==='listening')renderListening();if(id==='review')renderReview();if(id==='practice')renderPractice();if(id==='mock')renderMock()}
window.go=go;document.querySelectorAll('.nav button[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
function knownCount(){return Object.values(state.vocab).filter(x=>x==='known').length}function learningCount(){return Object.values(state.vocab).filter(x=>x==='learning').length}function difficultCount(){return Object.values(state.vocab).filter(x=>x==='difficult').length}
function overall(){return Math.round((state.done.length/18)*55+(knownCount()/300)*45)}
function renderChrome(){let p=overall();document.getElementById('overallPct').textContent=p+'%';document.getElementById('overallBar').style.width=p+'%';document.getElementById('lessonBadge').textContent=state.done.length+'/18'}
function status(h){return state.vocab[h]||'new'}function setStatus(h,s){if(s==='new')delete state.vocab[h];else state.vocab[h]=s;save();renderVocab();}
window.setStatus=setStatus;
function renderHome(){let next=DATA.lessons.find(l=>!state.done.includes(l.id))||DATA.lessons[17];let skills={Pronunciation:avg([1,2]),Vocabulary:Math.round((knownCount()/300)*100),Grammar:avg(DATA.lessons.map(x=>x.id)),Listening:audioProgress(),"Sentence Building":avg(DATA.lessons.map(x=>x.id))};document.getElementById('home').innerHTML=`<div class="hero"><div class="eyebrow">Mất gốc → thi được</div><h1>HSK 1 Reset</h1><p>Curriculum HSK 3.0 Level 1 theo 18 lesson ngắn. Vocabulary và grammar được học trong ngữ cảnh; audio SHZ thật dùng để reinforcement thay cho browser TTS.</p><div class="pills"><span class="pill">300 từ</span><span class="pill">18 lessons</span><span class="pill">Complete grammar map</span><span class="pill">39 SHZ audio tracks</span><span class="pill">Sentence Builder</span></div></div><div class="grid"><div class="card span3 stat"><b>${state.done.length}/18</b><span>Lessons hoàn thành</span></div><div class="card span3 stat"><b>${knownCount()}/300</b><span>Từ đã biết</span></div><div class="card span3 stat"><b>${state.practiceBest||'—'}</b><span>Best Practice /10</span></div><div class="card span3 stat"><b>${state.mockBest?state.mockBest+'/20':'—'}</b><span>Reading Mock</span></div><div class="card span7"><div class="eyebrow">Continue</div><h2>${String(next.id).padStart(2,'0')} · ${next.title}</h2><div class="cn" style="color:var(--brand2)">${next.zh}</div><p class="muted small">${next.subtitle}</p><button class="btn primary" onclick="openLesson(${next.id})">Continue lesson</button></div><div class="card span5"><h2>Knowledge map</h2>${Object.entries(skills).map(([k,v])=>`<div style="display:grid;grid-template-columns:135px 1fr 38px;gap:8px;align-items:center;margin:10px 0"><span class="small">${k}</span><div class="bar"><i style="width:${v}%"></i></div><b class="tiny">${v}%</b></div>`).join('')}</div><div class="card span12"><h2>Course map</h2><div class="lesson-grid">${DATA.lessons.slice(0,6).map(lessonCard).join('')}</div><div style="margin-top:12px"><button class="btn" onclick="go('learn')">View all 18 lessons →</button></div></div></div>`}
function avg(ids){if(!ids.length)return 0;let vals=ids.map(id=>state.scores[id]||0);return Math.round(vals.reduce((a,b)=>a+b,0)/ids.length)}function audioProgress(){let sourceLessons=[1,2,3,4,6,7,8,15];let done=sourceLessons.filter(x=>state.done.includes(x)).length;return Math.round(done/sourceLessons.length*100)}
function lessonCard(l){let done=state.done.includes(l.id);return `<div class="lesson-card ${done?'done':''}" onclick="openLesson(${l.id})"><div class="lesson-no">LESSON ${String(l.id).padStart(2,'0')} · ${l.unit}</div>${done?'<div class="doneflag">✓</div>':''}<h3>${l.title}</h3><div class="zh cn">${l.zh}</div><div class="meta"><span>${l.vocab.length} words</span><span>${l.grammar.length} grammar</span><span>${DATA.audio.filter(a=>a.lesson===l.id).length} audio</span></div></div>`}
function renderLearn(){let groups={};DATA.lessons.forEach(l=>(groups[l.unit]??=[]).push(l));document.getElementById('learn').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Course</div><h1>18 Lessons</h1><p class="muted">Learn → Vocabulary → Grammar → Listen → Build → Checkpoint. Mỗi lesson khoảng 10–20 phút và nối trực tiếp vào HSK 1 knowledge map.</p></div></div>`+Object.entries(groups).map(([u,ls])=>`<div class="unit">${u}</div><div class="lesson-grid">${ls.map(lessonCard).join('')}</div>`).join('')}
function vocabMini(h){let w=DATA.vocab.find(x=>x.hanzi===h)||{hanzi:h,pinyin:'',vi:''};let st=status(h);return `<div class="vmini"><b class="cn">${w.hanzi}</b><div class="py">${w.pinyin}</div><div class="vi">${w.vi}</div><div class="statusBtns"><button class="sbtn ${st==='learning'?'on':''}" onclick="event.stopPropagation();setStatus('${esc(h)}','learning')">Learning</button><button class="sbtn known ${st==='known'?'on known':''}" onclick="event.stopPropagation();setStatus('${esc(h)}','known')">Known</button><button class="sbtn difficult ${st==='difficult'?'on difficult':''}" onclick="event.stopPropagation();setStatus('${esc(h)}','difficult')">★</button></div></div>`}
function openLesson(id){let l=DATA.lessons.find(x=>x.id===id);if(!l)return;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='lessonDetail'));document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let tracks=DATA.audio.filter(a=>a.lesson===id);document.getElementById('lessonDetail').innerHTML=`<div class="lessonHero"><button class="back" onclick="go('learn')">← Course map</button><div class="eyebrow">LESSON ${String(l.id).padStart(2,'0')} · ${l.unit}</div><h1>${l.title}</h1><div class="cn" style="font-size:18px;color:var(--brand2)">${l.zh}</div><p class="muted">${l.subtitle}</p><div class="facts"><span class="fact">${l.vocab.length} vocabulary</span><span class="fact">${l.grammar.length} grammar points</span><span class="fact">${tracks.length} SHZ audio</span><span class="fact">${l.builders.length} sentence builders</span><span class="fact">${l.quiz.length} checkpoint questions</span></div><div class="flow"><span>Overview</span><span>Learn</span><span>Vocabulary</span><span>Grammar</span><span>Listen</span><span>Build</span><span>Checkpoint</span></div></div>
<div class="card block"><div class="blockTitle"><div class="step">01</div><h2>What you will learn</h2></div><div class="goalList">${l.goals.map(g=>`<div class="goalItem">${g}</div>`).join('')}</div></div>
<div class="card block"><div class="blockTitle"><div class="step">02</div><h2>Vocabulary</h2></div><div class="vocabStrip">${l.vocab.map(vocabMini).join('')}</div><div style="margin-top:12px"><button class="btn" onclick="go('vocabulary')">Open 300-word hub →</button></div></div>
<div class="card block"><div class="blockTitle"><div class="step">03</div><h2>Grammar</h2></div>${l.grammar.map(g=>`<div class="gpoint"><div class="gname">${g.name}</div><div class="pattern">${esc(g.pattern)}</div><p class="small muted">${g.explain}</p><div class="examples">${g.examples.map(e=>`<div class="ex"><div class="zh cn">${e[0]}</div><div class="small muted">${e[1]}</div></div>`).join('')}</div>${g.mistake?`<div class="mistake">⚠ ${g.mistake}</div>`:''}</div>`).join('')}</div>
<div class="card block"><div class="blockTitle"><div class="step">04</div><h2>Listening · SHZ reinforcement</h2></div>${tracks.length?`<div class="audioNote">Audio lấy từ companion files của đúng giáo trình SHZ Bài 1–4. Trong patch này, track được dùng để nghe lại/phát âm theo topic; transcript và scored item-level listening sẽ chỉ được thêm sau khi audit từng track, để không bịa đáp án.</div><div class="audioGrid">${tracks.map(audioCard).join('')}</div>`:`<div class="notice">Lesson này chưa có audio SHZ khớp trực tiếp từ Bài 1–4. Core knowledge vẫn đầy đủ; không dùng browser TTS để thay thế.</div>`}</div>
<div class="card block"><div class="blockTitle"><div class="step">05</div><h2>Sentence Builder</h2></div>${l.builders.map((b,i)=>builderHtml(l.id,i,b)).join('')}</div>
<div class="card block"><div class="blockTitle"><div class="step">06</div><h2>Checkpoint</h2></div><div id="checkpoint-${l.id}">${l.quiz.map((q,i)=>quizHtml(l.id,i,q)).join('')}<button class="btn primary" onclick="submitCheckpoint(${l.id})">Check lesson</button><div id="score-${l.id}"></div></div></div>
<div style="display:flex;justify-content:flex-end;margin:18px 0 40px"><button class="btn ${state.done.includes(l.id)?'good':'primary'}" onclick="toggleComplete(${l.id})">${state.done.includes(l.id)?'✓ Lesson completed':'Mark lesson complete'}</button></div>`;window.scrollTo({top:0,behavior:'smooth'})}
window.openLesson=openLesson;
function audioCard(a){return `<div class="audioCard"><span class="tag sourceTag">SHZ Bài ${a.shz}</span> <span class="tag">${a.kind}</span><h3 style="margin-top:8px">${a.title}</h3><audio controls preload="none" src="${encodeURI(a.src)}"></audio></div>`}
let builderState={};function builderHtml(lid,idx,b){let key=lid+'-'+idx;builderState[key]=[];return `<div class="builder" id="builder-${key}"><div class="builderPrompt">${b.prompt}</div><div class="tokenBank">${b.tokens.map((t,i)=>`<button class="token" data-key="${key}" data-index="${i}" onclick="chooseToken('${key}',${i},'${esc(t)}')">${t}</button>`).join('')}</div><div class="answerBank" id="ans-${key}"></div><div style="margin-top:8px"><button class="btn" onclick="resetBuilder('${key}')">Reset</button> <button class="btn primary" onclick="checkBuilder('${key}',${lid},${idx})">Check</button></div><div class="feedback" id="fb-${key}"></div></div>`}
function chooseToken(key,i,t){let b=document.querySelector(`#builder-${key} [data-index="${i}"]`);if(b.classList.contains('chosen'))return;b.classList.add('chosen');builderState[key].push({i,t});document.getElementById('ans-'+key).innerHTML=builderState[key].map(x=>`<button class="token" onclick="removeToken('${key}',${x.i})">${x.t}</button>`).join('')}
function removeToken(key,i){builderState[key]=builderState[key].filter(x=>x.i!==i);document.querySelector(`#builder-${key} [data-index="${i}"]`).classList.remove('chosen');document.getElementById('ans-'+key).innerHTML=builderState[key].map(x=>`<button class="token" onclick="removeToken('${key}',${x.i})">${x.t}</button>`).join('')}
function resetBuilder(key){builderState[key]=[];document.querySelectorAll(`#builder-${key} .tokenBank .token`).forEach(x=>x.classList.remove('chosen'));document.getElementById('ans-'+key).innerHTML='';document.getElementById('fb-'+key).textContent=''}
function checkBuilder(key,lid,idx){let b=DATA.lessons.find(x=>x.id===lid).builders[idx];let ans=builderState[key].map(x=>x.t);let ok=JSON.stringify(ans)===JSON.stringify(b.answer);let el=document.getElementById('fb-'+key);el.className='feedback '+(ok?'ok':'bad');el.innerHTML=ok?'✓ Chính xác.':'✕ Chưa đúng. Hint: '+b.hint}
window.chooseToken=chooseToken;window.removeToken=removeToken;window.resetBuilder=resetBuilder;window.checkBuilder=checkBuilder;
let cpAnswers={};function quizHtml(lid,i,q){return `<div class="quizQ"><div class="qtext">${i+1}. ${q.q}</div><div class="options">${q.opts.map((o,j)=>`<button class="opt" data-cp="${lid}-${i}" data-o="${j}" onclick="pickCP(${lid},${i},${j},this)">${o}</button>`).join('')}</div></div>`}function pickCP(lid,i,j,el){cpAnswers[lid+'-'+i]=j;el.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}window.pickCP=pickCP;
function submitCheckpoint(lid){let l=DATA.lessons.find(x=>x.id===lid),score=0;l.quiz.forEach((q,i)=>{let a=cpAnswers[lid+'-'+i];if(a===q.a)score++;document.querySelectorAll(`[data-cp="${lid}-${i}"]`).forEach(b=>{b.classList.remove('correct','wrong');if(+b.dataset.o===q.a)b.classList.add('correct');else if(+b.dataset.o===a)b.classList.add('wrong')})});let pct=Math.round(score/l.quiz.length*100);state.scores[lid]=Math.max(state.scores[lid]||0,pct);save();document.getElementById('score-'+lid).innerHTML=`<div class="score"><b>${score}/${l.quiz.length} · ${pct}%</b><div class="small muted">${pct>=80?'Đạt checkpoint.':'Review grammar và làm lại để đạt ≥80%.'}</div></div>`}window.submitCheckpoint=submitCheckpoint;
function toggleComplete(id){if(state.done.includes(id))state.done=state.done.filter(x=>x!==id);else state.done.push(id);save();openLesson(id)}window.toggleComplete=toggleComplete;
function renderVocab(){let root=document.getElementById('vocabulary');root.innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Official core</div><h1>300 Vocabulary</h1><p class="muted">Tra cứu và review toàn bộ Level 1. Lesson chỉ chọn subset theo topic; hub này giữ đủ 300 từ.</p></div></div><div class="toolbar"><input class="search" id="vSearch" placeholder="Tìm Hanzi, pinyin hoặc nghĩa Việt…"><select class="btn" id="vTopic"><option value="all">All topics</option>${[...new Set(DATA.vocab.map(x=>x.topic))].sort().map(t=>`<option>${t}</option>`).join('')}</select><select class="btn" id="vStatus"><option value="all">All status</option><option value="new">New</option><option value="learning">Learning</option><option value="known">Known</option><option value="difficult">Difficult</option></select></div><div class="tiny muted" id="vMeta"></div><div class="vocab-grid" id="vGrid" style="margin-top:10px"></div>`;['vSearch','vTopic','vStatus'].forEach(id=>document.getElementById(id).oninput=drawVocab);drawVocab()}
function drawVocab(){let q=document.getElementById('vSearch').value.toLowerCase().trim(),t=document.getElementById('vTopic').value,s=document.getElementById('vStatus').value;let list=DATA.vocab.filter(w=>(!q||(w.hanzi+w.pinyin+w.vi).toLowerCase().includes(q))&&(t==='all'||w.topic===t)&&(s==='all'||status(w.hanzi)===s));document.getElementById('vMeta').textContent=`${list.length}/300 · Known ${knownCount()} · Learning ${learningCount()} · Difficult ${difficultCount()}`;document.getElementById('vGrid').innerHTML=list.map(w=>{let st=status(w.hanzi);return `<div class="word ${st}"><h3 class="cn">${w.hanzi}<span class="topicchip">${w.topic}</span></h3><div class="py">${w.pinyin}</div><div class="meaning">${w.vi}</div>${w.example?`<div class="exampleBox"><div class="zh cn">${w.example.zh}</div><div class="muted">${w.example.py}</div><div>${w.example.vi}</div></div>`:''}<div class="statusBtns"><button class="sbtn ${st==='new'?'on':''}" onclick="setStatus('${esc(w.hanzi)}','new')">New</button><button class="sbtn ${st==='learning'?'on':''}" onclick="setStatus('${esc(w.hanzi)}','learning')">Learning</button><button class="sbtn known ${st==='known'?'on known':''}" onclick="setStatus('${esc(w.hanzi)}','known')">Known</button><button class="sbtn difficult ${st==='difficult'?'on difficult':''}" onclick="setStatus('${esc(w.hanzi)}','difficult')">★ Difficult</button></div></div>`}).join('')}
function renderGrammar(){document.getElementById('grammar').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Grammar Hub</div><h1>Complete Level 1 Map</h1><p class="muted">Grammar được nhóm theo chức năng. Các pattern quan trọng như 正反问句, 连动句, 双宾语句, 离合词 và 完成/变化/进行 đều đã có lesson riêng.</p></div></div>${DATA.grammarGroups.map(g=>`<details class="grammarGroup" open><summary>${g.name}</summary><div class="grammarItems">${g.items.map(i=>`<div>${i}</div>`).join('')}</div></details>`).join('')}<div class="notice goodnote">Muốn học một mục: mở Learn và vào lesson tương ứng. Grammar Hub dùng để kiểm tra coverage và review nhanh, không thay thế lesson.</div>`}
function renderListening(){let groups=[1,2,3,4];document.getElementById('listening').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Real audio</div><h1>SHZ Listening Bank</h1><p class="muted">39 companion tracks đúng với sách SHZ Bài 1–4. Không dùng browser TTS. Track đã được map vào lesson HSK 1 theo knowledge point.</p></div></div><div class="notice">Transcript và scored listening questions chưa được tự bịa từ filename; sẽ chỉ thêm sau khi audit chính xác từng track.</div>${groups.map(g=>`<div class="listenGroup"><div class="unit">SHZ BÀI ${g} · ${DATA.audio.filter(a=>a.shz===g).length} TRACKS</div><div class="audioGrid">${DATA.audio.filter(a=>a.shz===g).map(a=>audioCard(a)+`<div class="tiny muted" style="margin-top:5px">Mapped → Lesson ${String(a.lesson).padStart(2,'0')} ${DATA.lessons.find(l=>l.id===a.lesson).title}</div>`).join('')}</div></div>`).join('')}`}
function renderReview(){let difficult=DATA.vocab.filter(w=>status(w.hanzi)==='difficult'),learning=DATA.vocab.filter(w=>status(w.hanzi)==='learning'),weak=DATA.lessons.filter(l=>(state.scores[l.id]||0)<80&&!state.done.includes(l.id)).slice(0,5);document.getElementById('review').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Weak-point review</div><h1>Review</h1><p class="muted">Ưu tiên từ bạn tự đánh dấu và lesson chưa đạt checkpoint.</p></div></div><div class="reviewCards"><div class="reviewCard"><b>${learning.length}</b><span class="muted small">Learning words</span></div><div class="reviewCard"><b>${difficult.length}</b><span class="muted small">Difficult words</span></div><div class="reviewCard"><b>${weak.length}</b><span class="muted small">Lessons cần chú ý</span></div></div><div class="grid"><div class="card span6"><h2>Difficult vocabulary</h2>${difficult.length?difficult.slice(0,20).map(w=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)"><b class="cn">${w.hanzi}</b> · ${w.pinyin} <span class="muted">— ${w.vi}</span></div>`).join(''):'<p class="muted small">Chưa có từ nào được đánh dấu Difficult.</p>'}</div><div class="card span6"><h2>Lesson priority</h2>${weak.map(l=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><button class="btn" onclick="openLesson(${l.id})">${String(l.id).padStart(2,'0')}</button> <b>${l.title}</b> <span class="muted small">· best ${state.scores[l.id]||0}%</span></div>`).join('')||'<p class="muted small">Không có lesson yếu rõ rệt.</p>'}</div></div>`}
function makePractice(){practiceSet=[...DATA.practice].sort(()=>Math.random()-.5).slice(0,10);practiceAnswers={}}
function renderPractice(){if(!practiceSet.length)makePractice();document.getElementById('practice').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Mixed drill</div><h1>Practice</h1><p class="muted">10 câu random từ checkpoints của 18 lessons.</p></div><button class="btn" onclick="makePractice();renderPractice()">New set</button></div><div class="card">${practiceSet.map((q,i)=>`<div class="quizQ"><div class="tiny muted">Lesson ${String(q.lesson).padStart(2,'0')} · ${q.tag}</div><div class="qtext">${i+1}. ${q.q}</div><div class="options">${q.opts.map((o,j)=>`<button class="opt" data-pq="${i}" data-o="${j}" onclick="pickPractice(${i},${j},this)">${o}</button>`).join('')}</div></div>`).join('')}<button class="btn primary" onclick="submitPractice()">Check 10 questions</button><div id="practiceScore"></div></div>`}
function pickPractice(i,j,el){practiceAnswers[i]=j;el.parentNode.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}function submitPractice(){let s=0;practiceSet.forEach((q,i)=>{if(practiceAnswers[i]===q.a)s++;document.querySelectorAll(`[data-pq="${i}"]`).forEach(b=>{if(+b.dataset.o===q.a)b.classList.add('correct');else if(+b.dataset.o===practiceAnswers[i])b.classList.add('wrong')})});state.practiceBest=Math.max(state.practiceBest||0,s);save();document.getElementById('practiceScore').innerHTML=`<div class="score"><b>${s}/10</b><div class="small muted">${s>=8?'Target đạt.':'Review các lesson sai rồi thử set mới.'}</div></div>`}window.pickPractice=pickPractice;window.submitPractice=submitPractice;
function renderMock(){let qs=DATA.readingMock,q=qs[mockPos];document.getElementById('mock').innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Mock beta</div><h1>Reading · 20 Questions</h1><p class="muted">Listening mock chưa được giả lập bằng TTS. Phần Listening đang dùng SHZ real audio ở Listening Bank; scored mock sẽ thêm sau khi audit transcript + answer mapping.</p></div></div><div class="notice">Đây là quyết định có chủ ý: không tạo listening answer key từ audio chưa transcript.</div><div class="card"><div class="mockGrid">${qs.map((_,i)=>`<button class="mockDot ${mockAnswers[i]!==undefined?'answered':''} ${i===mockPos?'current':''}" onclick="mockPos=${i};renderMock()">${i+1}</button>`).join('')}</div><div class="tiny muted">Câu ${mockPos+1}/20</div><div class="qtext" style="font-size:20px;margin:12px 0">${q.q}</div><div class="options">${q.opts.map((o,j)=>`<button class="opt ${mockAnswers[mockPos]===j?'selected':''}" onclick="mockAnswers[${mockPos}]=${j};renderMock()">${o}</button>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:14px"><button class="btn" onclick="mockPos=Math.max(0,mockPos-1);renderMock()">← Prev</button><div><button class="btn" onclick="mockPos=Math.min(19,mockPos+1);renderMock()">Next →</button> <button class="btn primary" onclick="submitMock()">Submit</button></div></div><div id="mockScore"></div></div>`}
function submitMock(){let s=0;DATA.readingMock.forEach((q,i)=>{if(mockAnswers[i]===q.a)s++});state.mockBest=Math.max(state.mockBest||0,s);save();document.getElementById('mockScore').innerHTML=`<div class="score"><b>${s}/20 · ${s*5}%</b><div class="small muted">Reading-only beta. Review các câu sai bằng Practice/Grammar Hub.</div></div>`}window.renderMock=renderMock;window.submitMock=submitMock;
document.getElementById('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hsk1-master-progress.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('resetBtn').onclick=()=>{if(confirm('Xóa toàn bộ progress local trên browser này?')){localStorage.removeItem(KEY);location.reload()}};
renderChrome();renderHome();
</script>
</body></html>
